[package]
name = "strikedesk-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Axum desk API. Serves scans, Pine text, and a TradingView alert inbox."

[lib]
name = "strikedesk_api"
path = "src/lib.rs"

[[bin]]
name = "strikedesk"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
strikedesk-core = { workspace = true }
strikedesk-screener = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
